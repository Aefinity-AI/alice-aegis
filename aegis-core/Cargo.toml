[package]
name = "aegis-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Justin B. Thompson (Aefinity AI)"]
repository = "https://github.com/Aefinity-AI/alice-aegis"

[dependencies]
# The ONLY runtime dependency of the inference engine.
# serde + serde_json + serde_core + memchr (~27,700 lines) were removed in favour
# of src/json.rs (~150 lines), which parses exactly the two things we read.
libm = "0.2.16"

[[bin]]
name = "gemm_tile"
path = "benches/gemm_tile.rs"

[features]
# int8 activations match the reference BitNet, and the weights were trained
# against them (straight-through estimation). Measured: WikiText-2 perplexity
# 12.801 -> 12.738 for ~2% decode cost. `--no-default-features` restores the
# old f32 activation path.
default = ["int8_act"]
# Force the pre-2026-07-09 prefill path (one weight pass per token) so the
# batched GEMM can be A/B'd in the same session, on the same thermal state.
legacy_matmul = []
# Multi-threaded row-parallel kernels. Requires std, so it is OFF for the
# no_std UEFI unikernel, which stays single-threaded.
parallel = []
# Per-token absmax int8 activation quantization, applied as a quantize->
# dequantize round trip on the f32 path. Kept as a named feature so the
# quality effect stays A/B-able.
int8_act = []
# Diagnostic counters: record, per (token, layer), how many elements of the
# down_proj input are exactly 0.0 at the moment the kernel consumes it
# (ReLU^2 activation-sparsity probe). Counting only — no kernel change, no
# effect on computed values. Allocates per token; OFF by default.
act_stats = []
# Leg C1 (2026-08-29 pre-reg, state/reports/2026-08-29-COMPACT-AXIS-PREREG.md).
# Originally this feature also routed CIS-1 FullInt matvecs through the
# byte-identical-by-construction AVX2/NEON kernels (cis_avx2/cis_neon) instead
# of calling cis::ternary_matvec_i8 directly. As of 2026-09-06
# (state/reports/2026-09-06-VERIFY-TIMING-2B-BOX1.md: 8/8 suite receipts PASS
# bit-for-bit at 5.2-5.8x; ledger A44) that routing is unconditional in
# CisEngine::tmv_dispatch for every build, default included — this feature no
# longer controls it. What this feature still gates: recording the per
# (step, layer) active-neuron set (down_proj input nonzero indices) for
# cross-ISA / fast-vs-scalar digesting. OFF by default: the default build's
# call sites and CIS_DECODE digest are untouched by this feature.
active_set_digest = []
# E7c (2026-09-03): compile out every #[target_feature(enable = "avx2", ...)]
# kernel body in ops.rs (and the ops_bitplane/ops_colskip modules entirely —
# nothing outside those two files calls into them) so the resulting object
# code contains zero vfmadd*/vpmadd*/ymm instructions, independent of the
# runtime `simd_on()` dispatch. For third-party x86-64 hardware with no
# AVX2/FMA (e.g. Gemini Lake Celeron, box2's third iron leg): the f32
# production engine (`inference` module) falls back to the existing
# `*_scalar` kernels unconditionally; the ISA-independent CIS-1 reference
# chain (`cis`, `cis_infer`, `cis_attn`) is untouched — it already had zero
# x86 intrinsics (see lib.rs doc comment). OFF by default: normal builds are
# byte-for-byte unaffected.
scalar_only = []
# Amdahl decomposition of decode (2026-09): per-phase RDTSC/RDTSCP cycle
# counters for GEMV, attention, KV-cache write, RMSNorm, LM head, and
# sampling, owned by the engine's fixed-size counters (aegis-core/src/
# phase_timers.rs) — zero allocation, zero cost when this feature is off
# (the field, the module, and every timed span are compiled out entirely).
# See phase_timers.rs module docs for the RDTSC/RDTSCP fencing rationale and
# why KV-cache reads are bundled into the attention phase.
phase-timers = []

[[bin]]
name = "lut_mpgemm"
path = "benches/lut_mpgemm.rs"

[[bin]]
name = "ctz_vs_simd"
path = "benches/ctz_vs_simd.rs"

[[bin]]
name = "fused_vs_sequential"
path = "benches/fused_vs_sequential.rs"

[[bin]]
name = "bitplane_vs_lut"
path = "benches/bitplane_vs_lut.rs"

[[bin]]
name = "colskip_vs_incumbent"
path = "benches/colskip_vs_incumbent.rs"

[[bin]]
name = "cis_vs_float"
path = "benches/cis_vs_float.rs"
