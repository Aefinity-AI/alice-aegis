[package]
name = "cis-verify"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Justin B. Thompson (Aefinity AI)"]
repository = "https://github.com/Aefinity-AI/alice-aegis"
description = """
Standalone third-party verifier core for CIS-1 decode receipts
(AEGIS-WITNESS v1-CIS). no_std+alloc, zero runtime dependencies — see
docs/design/CIS_VERIFY_DESIGN.md.
"""

[lib]
name = "cis_verify"
path = "src/lib.rs"

[[bin]]
name = "cis-verify"
path = "src/bin/cis-verify.rs"
required-features = ["std"]

[[example]]
name = "cis_decode"
path = "examples/cis_decode.rs"
required-features = ["std"]

[dependencies]
# None. See docs/design/CIS_VERIFY_DESIGN.md §3.2: no serde, no sha2, no
# clap — this crate reimplements exactly the narrow slice of each format it
# needs, deliberately, so the audited surface is entirely its own source.

[features]
default = []
# Gates `src/bin/cis-verify.rs` (file I/O, argv, stdout) and
# `examples/cis_decode.rs`. The verification core (sha256, fnv, witness
# chain, receipt parsing, artifact hashing, MODEL.SAF/VOCAB.BIN parsing,
# the tokenizer, and the FullInt forward pass) is std-independent either
# way — `no_std` + `alloc` regardless of this feature.
std = []
