name: bitnet2b-receipt

# E3: the witness v1 cross-ISA claim (A32/A38, arm-digest.yml), extended to
# the full BitNet-2B model instead of the tiny M7 in-repo model.
#
# The 2B artifacts (~745 MB combined) are too large to commit, so they live
# as release assets on tag `artifacts-bitnet2b-2026-08-27` (see ledger A36).
# This workflow downloads them fresh on each runner, checks their hashes,
# then runs the same three-stage identity chain arm-digest.yml runs for the
# M7 model — token-level decode digest, in-repo witness verify, and the
# standalone third-party cis-verify CLI — against the new golden receipt
# `tests/golden/witness_v1_bitnet2b_once64.receipt` (cis-digest
# cab11400d737ac4a, pinned x86 in A36).
#
# CLAUDE.md Rule A: identity/correctness artifact ONLY. No timing figure from
# this job may ever be recorded or quoted; CI hardware is shared and unnamed.
# Rule B: every assert below is instrument-backed by this run's own log,
# uploaded as an artifact — a red run here is a publishable negative finding,
# not a flake to retry past.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: artifacts-bitnet2b-2026-08-27
  MODEL_SHA: facb3597665603ba45730cc1f70ba6d82f53473d97f04fd039ca4296a45868db
  EMBED_SHA: e32b99a25e345c65054f36dedf40329a89513cdf1a8195db64fc440fd364e077
  VOCAB_SHA: 5bde1b0355ef99c6875190ebfff081d985ca48977ae9269e3477f5cc2d97d9ae

jobs:
  receipt-x86:
    name: x86_64 — BitNet-2B decode receipt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Confirm this is really x86_64
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-x86-2b-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-x86-2b-cargo-

      - name: Download BitNet-2B artifacts from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p 2b-artifacts
          gh release download "$RELEASE_TAG" --repo ${{ github.repository }} --dir 2b-artifacts --clobber

      - name: Verify artifact hashes
        run: |
          set -euo pipefail
          cd 2b-artifacts
          sha256sum aegis_pruned_model.cis.safetensors embed.bin vocab.bin | tee /dev/stderr | tee sha256sums.txt
          echo "$MODEL_SHA  aegis_pruned_model.cis.safetensors" | sha256sum -c - || {
            echo '::error::MODEL hash mismatch — downloaded artifact does not match the pinned A36 hash. Preserve sha256sums.txt as a finding.'
            exit 1
          }
          echo "$EMBED_SHA  embed.bin" | sha256sum -c - || {
            echo '::error::EMBED hash mismatch — downloaded artifact does not match the pinned A36 hash. Preserve sha256sums.txt as a finding.'
            exit 1
          }
          echo "$VOCAB_SHA  vocab.bin" | sha256sum -c - || {
            echo '::error::VOCAB hash mismatch — downloaded artifact does not match the pinned A36 hash. Preserve sha256sums.txt as a finding.'
            exit 1
          }
          echo "all three BitNet-2B artifact hashes match the A36 pins."

      - name: Build the decode + witness drivers
        run: |
          cargo build --release --example cis_decode  --manifest-path aegis-linux/Cargo.toml
          cargo build --release --example cis_witness --manifest-path aegis-linux/Cargo.toml

      - name: Token-level decode — pin the BitNet-2B digest
        run: |
          set -euo pipefail
          M=2b-artifacts
          ./aegis-linux/target/release/examples/cis_decode "$M/aegis_pruned_model.cis.safetensors" "$M/embed.bin" "$M/vocab.bin" 64 "Once upon a time" \
            | tee /dev/stderr | tee cis-decode.log \
            | grep '^CIS_DECODE ' | grep -q 'digest=cab11400d737ac4a' || {
            echo '::error::TOKEN-LEVEL DIGEST MISMATCH — this host does not reproduce the A36 BitNet-2B decode digest. This falsifies token-level cross-ISA identity for the 2B model and is a finding: preserve cis-decode.log verbatim.'
            exit 1
          }
          echo "BitNet-2B token-level decode reproduces digest=cab11400d737ac4a on $(uname -m)."

      - name: Witness v1 — verify the BitNet-2B golden receipt
        run: |
          set -euo pipefail
          M=2b-artifacts
          ./aegis-linux/target/release/examples/cis_witness verify \
            "$M/aegis_pruned_model.cis.safetensors" "$M/embed.bin" "$M/vocab.bin" \
            tests/golden/witness_v1_bitnet2b_once64.receipt \
            | tee /dev/stderr | tee cis-witness-verify.log \
            | grep -q 'VERIFY PASS' || {
            echo '::error::WITNESS VERIFY FAIL — cis_witness did not reproduce the BitNet-2B golden receipt on this host. Preserve cis-witness-verify.log verbatim.'
            exit 1
          }
          echo "cis_witness reproduces VERIFY PASS on the BitNet-2B receipt on $(uname -m)."

      - name: cis-verify (standalone verifier) — CLI verifies the BitNet-2B golden receipt
        run: |
          set -euo pipefail
          M=2b-artifacts
          cargo run --release --features std --manifest-path cis-verify/Cargo.toml --bin cis-verify -- \
            tests/golden/witness_v1_bitnet2b_once64.receipt \
            "$M/aegis_pruned_model.cis.safetensors" "$M/embed.bin" "$M/vocab.bin" \
            2>&1 | tee /dev/stderr | tee cis-verify-2b.log \
            | grep -q 'VERIFY PASS' || {
            echo '::error::cis-verify (standalone verifier) did not print VERIFY PASS on the BitNet-2B golden receipt — this falsifies the independent-verifier claim for the 2B model and is a finding: preserve cis-verify-2b.log verbatim. If this is a resource limit or shape assumption inside cis-verify rather than a genuine mismatch, that is itself the finding — do not retry blindly.'
            exit 1
          }
          echo "standalone cis-verify CLI reproduces VERIFY PASS on the BitNet-2B receipt on $(uname -m)."

      - name: Upload logs (x86_64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitnet2b-receipt-logs-x86_64
          path: |
            2b-artifacts/sha256sums.txt
            cis-decode.log
            cis-witness-verify.log
            cis-verify-2b.log

  receipt-arm:
    name: aarch64 — BitNet-2B decode receipt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Confirm this is really aarch64 (the whole point)
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
          grep -m1 -E 'model name|CPU part' /proc/cpuinfo || true

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-arm-2b-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-arm-2b-cargo-

      - name: Download BitNet-2B artifacts from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p 2b-artifacts
          gh release download "$RELEASE_TAG" --repo ${{ github.repository }} --dir 2b-artifacts --clobber

      - name: Verify artifact hashes
        run: |
          set -euo pipefail
          cd 2b-artifacts
          sha256sum aegis_pruned_model.cis.safetensors embed.bin vocab.bin | tee /dev/stderr | tee sha256sums.txt
          echo "$MODEL_SHA  aegis_pruned_model.cis.safetensors" | sha256sum -c - || {
            echo '::error::MODEL hash mismatch — downloaded artifact does not match the pinned A36 hash. Preserve sha256sums.txt as a finding.'
            exit 1
          }
          echo "$EMBED_SHA  embed.bin" | sha256sum -c - || {
            echo '::error::EMBED hash mismatch — downloaded artifact does not match the pinned A36 hash. Preserve sha256sums.txt as a finding.'
            exit 1
          }
          echo "$VOCAB_SHA  vocab.bin" | sha256sum -c - || {
            echo '::error::VOCAB hash mismatch — downloaded artifact does not match the pinned A36 hash. Preserve sha256sums.txt as a finding.'
            exit 1
          }
          echo "all three BitNet-2B artifact hashes match the A36 pins."

      - name: Build the decode + witness drivers
        run: |
          cargo build --release --example cis_decode  --manifest-path aegis-linux/Cargo.toml
          cargo build --release --example cis_witness --manifest-path aegis-linux/Cargo.toml

      - name: Token-level decode — pin the BitNet-2B digest
        run: |
          set -euo pipefail
          M=2b-artifacts
          ./aegis-linux/target/release/examples/cis_decode "$M/aegis_pruned_model.cis.safetensors" "$M/embed.bin" "$M/vocab.bin" 64 "Once upon a time" \
            | tee /dev/stderr | tee cis-decode.log \
            | grep '^CIS_DECODE ' | grep -q 'digest=cab11400d737ac4a' || {
            echo '::error::DIGEST MISMATCH — aarch64 does not reproduce the x86 BitNet-2B decode digest. This falsifies token-level cross-ISA identity for the 2B model and is a finding: preserve cis-decode.log verbatim.'
            exit 1
          }
          echo "aarch64 reproduces the x86 BitNet-2B decode digest cab11400d737ac4a: cross-ISA identity holds for the 2B model too."

      - name: Witness v1 — verify the x86-minted BitNet-2B golden receipt on ARM
        run: |
          set -euo pipefail
          M=2b-artifacts
          ./aegis-linux/target/release/examples/cis_witness verify \
            "$M/aegis_pruned_model.cis.safetensors" "$M/embed.bin" "$M/vocab.bin" \
            tests/golden/witness_v1_bitnet2b_once64.receipt \
            | tee /dev/stderr | tee cis-witness-verify.log \
            | grep -q 'VERIFY PASS' || {
            echo '::error::WITNESS VERIFY FAIL — cis_witness did not reproduce the x86-minted BitNet-2B receipt on aarch64. Preserve cis-witness-verify.log verbatim.'
            exit 1
          }
          echo "x86-minted BitNet-2B witness receipt verifies on $(uname -m)."

      - name: cis-verify (standalone verifier) — CLI verifies the BitNet-2B golden receipt on aarch64
        run: |
          set -euo pipefail
          M=2b-artifacts
          cargo run --release --features std --manifest-path cis-verify/Cargo.toml --bin cis-verify -- \
            tests/golden/witness_v1_bitnet2b_once64.receipt \
            "$M/aegis_pruned_model.cis.safetensors" "$M/embed.bin" "$M/vocab.bin" \
            2>&1 | tee /dev/stderr | tee cis-verify-2b.log \
            | grep -q 'VERIFY PASS' || {
            echo '::error::cis-verify (standalone verifier) did not print VERIFY PASS on the BitNet-2B golden receipt on aarch64 — this falsifies the independent-verifier cross-ISA claim for the 2B model and is a finding: preserve cis-verify-2b.log verbatim. If this is a resource limit or shape assumption inside cis-verify rather than a genuine mismatch, that is itself the finding — do not retry blindly.'
            exit 1
          }
          echo "standalone cis-verify CLI reproduces VERIFY PASS on the BitNet-2B receipt on $(uname -m)."

      - name: Upload logs (aarch64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitnet2b-receipt-logs-aarch64
          path: |
            2b-artifacts/sha256sums.txt
            cis-decode.log
            cis-witness-verify.log
            cis-verify-2b.log
