# SAFE-5c: drop into /etc/ssh/sshd_config.d/ on box2 (or append to
# /etc/ssh/sshd_config on older sshd without a .d/ include). Scopes the
# forced-command restriction to a Match block keyed on the dedicated
# box1-agent user/key, so it cannot accidentally loosen any other
# account's ssh access on box2.
#
# STATUS: NOT installed -- drafted only, per
# state/reports/2026-09-14-safe5c-box2-half.md. Also NOT sufficient by
# itself: the authorized_keys `command=`/no-* options in
# ./sshd-authorized-keys-snippet are the actual forcing mechanism; this
# Match block is defense-in-depth (belt + suspenders) in case that file
# is ever edited carelessly.

Match User cm-box1-agent
    PasswordAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    PermitOpen none
    ForceCommand /home/cm/projects/alice-aegis/demo/agent-trace/gateway/deploy/inter-box/gateway-relay.sh
